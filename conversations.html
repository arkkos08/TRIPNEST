<!DOCTYPE html>
<html lang="el">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TripNest Conversations</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body class="dashboard-body">
  <div class="tripnest-home-shell">
    <aside class="tripnest-sidebar">
      <a id="profileNavLink" class="tripnest-sidebar-item" href="./profile.html">
        <span class="tripnest-sidebar-icon">T</span>
        <span class="tripnest-sidebar-copy">
          <span id="profileNavTitle" class="tripnest-sidebar-title">Profile</span>
          <span class="tripnest-sidebar-subtitle">My profile</span>
        </span>
      </a>
      <a class="tripnest-sidebar-item active" href="./conversations.html">
        <span class="tripnest-sidebar-icon">C</span>
        <span class="tripnest-sidebar-copy">
          <span class="tripnest-sidebar-title">Conversations</span>
          <span class="tripnest-sidebar-subtitle">Inbox and messages</span>
        </span>
      </a>
      <a class="tripnest-sidebar-item" href="./saved.html">
        <span class="tripnest-sidebar-icon">S</span>
        <span class="tripnest-sidebar-copy">
          <span class="tripnest-sidebar-title">Saved</span>
          <span class="tripnest-sidebar-subtitle">My saved posts</span>
        </span>
      </a>
      <a class="tripnest-sidebar-item" href="./trip-plans.html">
        <span class="tripnest-sidebar-icon">T</span>
        <span class="tripnest-sidebar-copy">
          <span class="tripnest-sidebar-title">Trip planning</span>
          <span class="tripnest-sidebar-subtitle">Plan and find a crew</span>
        </span>
      </a>
      <a class="tripnest-sidebar-item" href="./offers.html">
        <span class="tripnest-sidebar-icon">O</span>
        <span class="tripnest-sidebar-copy">
          <span class="tripnest-sidebar-title">Offers</span>
          <span class="tripnest-sidebar-subtitle">Cheap flights and stays</span>
        </span>
      </a>
    </aside>

    <nav class="tripnest-topbar">
      <div class="tripnest-topbar-left">
        <a class="tripnest-topbar-logo tripnest-topbar-logo-link" href="./home.html">T</a>
        <input class="tripnest-topbar-search" type="text" placeholder="Search" />
      </div>
      <a class="tripnest-back-link" href="./home.html">Back to map</a>
      <button id="logoutBtn" class="tripnest-logout-btn">Logout</button>
    </nav>

    <main class="tripnest-home-content">
      <section class="tripnest-conversations-shell">
        <div class="tripnest-conversations-sidebar card">
          <div class="tripnest-conversations-head">
            <h1>Conversations</h1>
            <p>See your history and message other users.</p>
          </div>
          <div class="tripnest-conversation-search">
            <input
              id="conversationSearchInput"
              type="text"
              placeholder="Search user"
              autocomplete="off"
            />
          </div>
          <div id="conversationThreadsList" class="tripnest-conversation-threads"></div>
        </div>

        <section class="tripnest-conversation-main card">
          <div id="conversationEmptyState" class="tripnest-conversation-empty-state"></div>

          <div id="conversationPanel" class="tripnest-conversation-panel" hidden>
            <div class="tripnest-conversation-active-bar">
              <strong id="conversationPartnerUsername">username</strong>
              <button id="conversationClearBtn" type="button" class="tripnest-conversation-clear-btn">Clear conversation</button>
            </div>

            <p id="conversationMessage" class="tripnest-edit-message"></p>
            <div id="conversationMessagesList" class="tripnest-conversation-messages"></div>

            <form id="conversationForm" class="tripnest-conversation-form">
              <div class="tripnest-conversation-composer-row">
                <div class="tripnest-conversation-attachment-shell">
                  <input id="conversationAttachmentInput" type="file" hidden />
                  <button id="conversationAttachmentBtn" type="button" class="secondary-btn" title="You can attach a file up to 100MB.">📎 File</button>
                  <div id="conversationAttachmentPreview" class="tripnest-conversation-attachment-preview" hidden>
                    <span id="conversationAttachmentName"></span>
                    <button id="conversationAttachmentClear" type="button" class="tripnest-comment-delete-btn">Remove</button>
                  </div>
                </div>
                <div class="tripnest-conversation-input-shell">
                  <textarea id="conversationInput" rows="3" placeholder="Type your message..."></textarea>
                </div>
                <div class="tripnest-conversation-composer-tools">
                  <div class="tripnest-conversation-emoji-shell">
                    <button id="conversationEmojiToggle" type="button" class="secondary-btn">😊 Emoji</button>
                    <button id="conversationQuickLike" type="button" class="tripnest-conversation-quick-like" title="Quick thumbs up">👍</button>
                    <div id="conversationEmojiPicker" class="tripnest-conversation-emoji-picker" hidden></div>
                  </div>
                </div>
              </div>
              <button type="submit" class="primary-btn">Send</button>
            </form>
          </div>
        </section>
      </section>
    </main>
  </div>

  <script src="./nav-search.js"></script>
  <script src="./conversations.js"></script>
</body>
</html>
